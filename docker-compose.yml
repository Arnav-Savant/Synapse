# docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: synapse
      DATABASE_PASSWORD: synapse
      DATABASE_NAME: synapse
      APP_HOST: "127.0.0.1"
      APP_PORT: "8000"
      KUZU_DB_PATH: /data/kuzu
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - kuzu-data:/data/kuzu

volumes:
  pg-data:
  kuzu-data:
