# docker-compose.yml
#
# Postgres only. The backend runs on the host directly (`poetry run python
# main.py`), not in a container: it invokes the `claude` CLI as a subprocess
# and relies on the host user's own OAuth login (`~/.claude/.credentials.json`,
# see docs/ARCHITECTURE.md §5.1/FR2.2) — a container has neither the `claude`
# CLI installed nor that credential file, so containerizing the backend would
# break every agent invocation. (An earlier `backend` service + `backend/Dockerfile`
# existed here from before that constraint was locked in; removed as dead,
# non-functional weight — see git history if a containerized backend is ever
# revisited with the CLI/credential mounting worked out properly.)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse
      POSTGRES_DB: synapse
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  pg-data:
