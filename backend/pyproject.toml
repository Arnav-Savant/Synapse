[project]
name = "synapse-backend"
version = "0.1.0"
description = "Synapse backend — FastAPI service, filesystem-backed knowledge engine"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "kuzu>=0.6",
    "mcp>=1.9",
    "langgraph>=1.2,<2.0",
    "httpx>=0.27",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
httpx = ">=0.27"
pytest-asyncio = ">=0.24"

[tool.pytest.ini_options]
# Without __init__.py files (app/ and tests/ are namespace packages),
# pytest's import-mode heuristic doesn't put backend/ on sys.path on its
# own — this makes `from app...` resolve during test collection.
pythonpath = ["."]
asyncio_mode = "auto"
# postgres_connection is a module-level singleton (one AsyncEngine/pool for
# the whole process); the default function-scoped event loop would tear
# that loop down after every async test while pooled asyncpg connections
# stay open, so the next test's loop reuses connections bound to a dead
# loop. Session-scoped loop keeps one loop alive for the whole run instead.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
